services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: detailly
      POSTGRES_USER: detailly
      POSTGRES_PASSWORD: detailly_local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detailly -d detailly"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - detailly_postgres:/var/lib/postgresql/data

volumes:
  detailly_postgres:
